name: Feature request
description: Suggest a focused improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        blueprint1 is early. Focused, well-scoped ideas are easiest to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any simpler alternatives or tradeoffs?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples, or related links.
    validations:
      required: false
